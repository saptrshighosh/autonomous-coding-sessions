schema_version: "1.1"
name: merge-when-ready-risk-tiers
expected_outcome: |
  Says merge-when-ready is not the default and depends on risk. Recommends CI that actually catches what matters, a fresh-context reviewer separate from the author session, and tiered human review (none for docs or copy after green checks, one reviewer for ordinary changes, two for risky), enabling merge-when-ready only for the low-risk tier.
